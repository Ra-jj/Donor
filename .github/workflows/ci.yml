# Runs the server tests, the client lint + build and the browser tests on every pull request to main
# and every push to main. GitHub branch protection requires checks by job name ("Server tests",
# "Client build"), so rename them there too if they change here. "Browser tests" is only required
# once it is added to the "Protect main" ruleset as well. Render's "After CI Checks Pass" waits for
# every check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Without this, the mongodb-memory-server postinstall in `npm ci` downloads mongod into
      # server/node_modules/.cache (wiped by every npm ci) instead of the cached folder below
      MONGOMS_PREFER_GLOBAL_PATH: 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node major as Render, which reads engines.node from the root package.json
          node-version-file: package.json
          cache: npm
          cache-dependency-path: server/package-lock.json

      # mongodb-memory-server downloads a ~150 MB mongod binary on first use; keep it between runs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci

      - run: npm test -- --ci

  client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node major as Render, which reads engines.node from the root package.json
          node-version-file: package.json
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # oxlint exits 0 on warnings by default, so make them fail the job
      - run: npm run lint -- --deny-warnings

      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # As in the server job: mongod goes to the cached folder below, not server/node_modules/.cache
      MONGOMS_PREFER_GLOBAL_PATH: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node major as Render, which reads engines.node from the root package.json
          node-version-file: package.json
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      # The same mongod binary and cache as the server job: the tests run the real server on it
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      # Chromium for the Playwright version pinned in e2e/package-lock.json, kept between runs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - run: npm ci
        working-directory: server

      # The tests drive the built client, served by the server as in production
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

      - run: npm ci
        working-directory: e2e

      # Downloads Chromium unless the cache above had it, and always installs the system
      # libraries it needs on this runner (those are not cached)
      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npm test
        working-directory: e2e

      # The HTML report, plus a screenshot and a trace of each failed test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
